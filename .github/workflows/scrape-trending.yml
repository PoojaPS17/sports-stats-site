name: Scrape trending signals

on:
  schedule:
    # The App Store charts move within the day; Wikipedia's pageview data is only
    # complete once a day, but re-fetching it hourly is cheap and harmless (each run
    # just wipes and re-inserts its own slice).
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: scrape-trending
  cancel-in-progress: false

jobs:
  scrape-trending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate

      - name: Fetch trending Wikipedia figures
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fetch:trending-wikipedia

      - name: Fetch trending App Store apps
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fetch:trending-appstore
