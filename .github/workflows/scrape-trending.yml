name: Scrape trending signals

# The schedule (hourly) now runs from the Oracle VM's systemd timers
# (sportsdb-scrape-trending.timer), so this workflow is manual only: run it from the Actions tab.
on:
  workflow_dispatch: {}

concurrency:
  group: scrape-trending
  cancel-in-progress: false

jobs:
  scrape-trending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate

      - name: Fetch trending Wikipedia figures
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fetch:trending-wikipedia

      - name: Fetch trending App Store apps
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fetch:trending-appstore
