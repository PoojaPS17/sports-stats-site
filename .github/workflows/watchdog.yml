# Independent alarm for the scrapers. The VM's own hourly job runs `npm run check:stale`, but if
# the VM's systemd schedule stops (VM down, timers disabled, job hung) nothing running inside it
# can notice. This workflow runs on GitHub instead and fails when any scraper heartbeat is missing
# or too old. It reads /api/health over HTTPS (through Cloudflare) rather than connecting to the
# database directly, so this workflow no longer needs the DATABASE_URL secret or a checkout at
# all; /api/health runs the exact same check (see scripts/lib/heartbeat.ts, MAX_AGE_MINUTES) that
# the route and check:stale both call, so the two can't drift out of sync. GitHub emails the repo
# owner on failure.
name: "Watchdog: scraper freshness"

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any scraper heartbeat is stale
        run: |
          body="$(curl -sS -w '\n%{http_code}' https://sports-db.live/api/health)"
          code="$(echo "$body" | tail -1)"
          echo "$body" | head -n -1
          [ "$code" = "200" ] || { echo "health check returned HTTP $code"; exit 1; }
