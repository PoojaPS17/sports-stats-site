name: Scrape ESPN data

# The schedule (a live-game tick every 15 minutes, a full update daily) now runs from the
# Oracle VM's systemd timers, so this workflow is manual only: run it from the Actions tab.
on:
  workflow_dispatch: {}

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check whether a full update is needed
        id: gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_SCRAPE: ${{ github.event.schedule == '7 6 * * *' || github.event_name == 'workflow_dispatch' }}
        run: npm run check:live

      - name: Apply schema (idempotent)
        if: steps.gate.outputs.should_scrape == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate

      - name: Seed teams (idempotent)
        if: steps.gate.outputs.should_scrape == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPE_LEAGUES: ${{ steps.gate.outputs.leagues }}
        run: npm run seed:teams

      # A live tick touches only the leagues the gate flagged and fetches only new box
      # scores; season totals (one request per player) refresh on the daily full run.
      - name: Fetch scores, standings and player stats
        if: steps.gate.outputs.should_scrape == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPE_MODE: ${{ steps.gate.outputs.mode }}
          SCRAPE_LEAGUES: ${{ steps.gate.outputs.leagues }}
        run: npm run fetch:all

      # Tennis runs all day in every time zone, so its day feed is read on every tick,
      # gate or not: the last three days (late finishes, corrected results) and the
      # week ahead (order of play), about ten cheap requests.
      - name: Fetch tennis day feed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fetch:tennis-daily

      # Every cricket series ESPN lists (tours, tournaments, domestic leagues, men's
      # and women's) with fixtures and results: the Series directory. Three requests
      # per tick for the live window; the daily run also sweeps the next 90 days.
      - name: Fetch cricket series listing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fetch:cricket-series -- --days 1 --ahead 2

      - name: Sweep the cricket series calendar
        if: github.event.schedule == '7 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fetch:cricket-series -- --days 10 --ahead 90

      - name: Fetch tennis rankings and season calendar
        if: github.event.schedule == '7 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run fetch:tennis-rankings
          npm run fetch:tennis-daily -- --calendar --days 1 --ahead 1

      # Men's ODIs and T20Is the weekly Cricsheet archive does not carry yet (or ever:
      # it withholds Afghanistan's matches) — a three-week sweep of ESPN's daily
      # cricket listing, so leader boards and team results never lag a series.
      - name: Fill international cricket gaps from ESPN
        if: github.event.schedule == '7 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run import:cricket-espn

      # Matches of the eight ESPN-fed cricket competitions the scores scrape never saw (a whole
      # past season, as with WBBL 2025): the previous and current season's scoreboard, missing
      # games only. Two requests per competition.
      - name: Fill missing cricket competition games
        if: github.event.schedule == '7 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run sweep:cricket-seasons

      # Whole-season schedules (every remaining fixture, plus NFL week numbers) —
      # once a day is plenty; the 15-minute tick only needs the scoreboard window.
      - name: Fetch full-season fixtures
        if: steps.gate.outputs.should_scrape == 'true' && (github.event.schedule == '7 6 * * *' || github.event_name == 'workflow_dispatch')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fetch:fixtures
