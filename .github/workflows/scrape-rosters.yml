name: Scrape rosters

# The schedule (once a day, 08:17 UTC) now runs from the Oracle VM's systemd timers
# (sportsdb-scrape-rosters.timer), so this workflow is manual only: run it from the Actions tab.
on:
  workflow_dispatch: {}

concurrency:
  group: scrape-rosters
  cancel-in-progress: false

jobs:
  scrape-rosters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate

      - name: Fetch team rosters
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fetch:rosters

      - name: Fetch IPL rosters (via most recent match, since the roster endpoint 404s)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fetch:cricket-rosters

      - name: Fetch player photos from Wikimedia Commons (players ESPN has no headshot for)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fetch:player-photos

      - name: Fetch team info (venue, head coach)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run fetch:team-info
