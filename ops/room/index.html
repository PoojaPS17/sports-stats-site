  // The basement: one rack per scraper with three lights, the backup vault, the
  // pipe through the wall and the belt the scrape ticks ride in on.
  drawBasement(ctx, t) {
    const c = this.tone();
    const blink = Math.floor(t / 8) % 2 === 0;
    for (let i = 0; i < this.RACKS.length; i += 1) {
      const rx = 24 + i * 14;
      ctx.fillStyle = c.line;
      ctx.fillRect(rx, 188, 12, 24);
      ctx.fillStyle = "#182342";
      ctx.fillRect(rx + 1, 189, 10, 22);
      ctx.fillStyle = "#2b3a63";
      ctx.fillRect(rx + 1, 195, 10, 1);
      ctx.fillRect(rx + 1, 201, 10, 1);
      ctx.fillRect(rx + 1, 207, 10, 1);
      const state = this.rackState(this.RACKS[i]);
      const lamp = state === "none" ? this.PAL.m : state === "bad" ? this.PAL.r : state === "spare" ? this.PAL.t : this.PAL.g;
      for (let j = 0; j < 3; j += 1) {
        ctx.fillStyle = j === 1 && !blink ? this.PAL.k : lamp;
        ctx.fillRect(rx + 3, 191 + j * 6, 6, 2);
      }
    }

    const vault = this.vaultState();
    ctx.fillStyle = c.line;
    ctx.fillRect(110, 188, 22, 24);
    ctx.fillStyle = "#34426a";
    ctx.fillRect(111, 189, 20, 22);
    if (vault === "fresh") {
      ctx.fillStyle = this.PAL.k;
      ctx.fillRect(112, 190, 13, 20);
      ctx.fillStyle = this.PAL.g;
      ctx.fillRect(114, 194, 9, 13);
      ctx.fillStyle = this.PAL.m;
      ctx.fillRect(126, 190, 4, 20);
    } else {
      ctx.fillStyle = this.PAL.m;
      ctx.fillRect(112, 190, 18, 20);
      ctx.fillStyle = c.line;
      ctx.fillRect(121, 190, 1, 20);
      this.disc(ctx, 121, 200, 3);
      ctx.fillStyle = this.PAL.m;
      this.disc(ctx, 121, 200, 1);
    }
    ctx.fillStyle = vault === "fresh" ? this.PAL.g : vault === "none" ? this.PAL.m : this.PAL.r;
    ctx.fillRect(119, 184, 4, 2);

    ctx.fillStyle = this.PAL.m;
    ctx.fillRect(134, 192, 8, 5);
    ctx.fillRect(134, 192, 4, 22);
    ctx.fillStyle = c.line;
    ctx.fillRect(134, 192, 8, 1);
    ctx.fillRect(134, 197, 4, 1);

    ctx.fillStyle = "#34426a";
    ctx.fillRect(22, 214, 116, 4);
    ctx.fillStyle = this.PAL.k;
    for (let x = 24; x < 138; x += 6) ctx.fillRect(x, 216, 2, 1);
    ctx.fillStyle = this.PAL.l;
    for (let i = 0; i < 4; i += 1) {
      ctx.fillRect(26 + ((i * 28 + Math.floor(t / 2)) % 108), 211, 3, 3);
    }
  },

  drawFigures(ctx, t) {
    const idle = Math.floor(t / 16) % 2;
    const walk = Math.floor(t / 2) % 2;
    for (const fig of this.FIGURES) {
      const p = this.pos[fig.id] || fig.home;
      this.drawSprite(ctx, fig.id, p.x, p.y, this.moving[fig.id] ? walk : idle);
      if (fig.id !== this.selected) continue;
      ctx.fillStyle = this.PAL.l;
      ctx.fillRect(p.x + 3, p.y - 6, 6, 1);
      ctx.fillRect(p.x + 4, p.y - 5, 4, 1);
      ctx.fillRect(p.x + 5, p.y - 4, 2, 1);
    }
  },

  // ---- the day ----

  resetPositions() {
    const pos = {};
    for (const fig of this.FIGURES) pos[fig.id] = { x: fig.home.x, y: fig.home.y };
    this.pos = pos;
    this.moving = {};
  },

  homeOf(id) {
    for (const fig of this.FIGURES) if (fig.id === id) return fig.home;
    return { x: 60, y: 120 };
  },

  // 0 before a, 1 after b, and the fraction in between.
  phase(t, a, b) {
    if (b <= a) return t >= b ? 1 : 0;
    return Math.max(0, Math.min(1, (t - a) / (b - a)));
  },

  place(id, x, y) {
    const p = this.pos[id];
    if (!p) return;
    if (Math.round(x) !== p.x || Math.round(y) !== p.y) this.moving[id] = true;
    p.x = Math.round(x);
    p.y = Math.round(y);
  },

  // Walk sideways to a mark and back to the home mark inside one step.
  visit(id, toX, t, out, back) {
    const home = this.homeOf(id);
    const go = this.phase(t, 0, out);
    const ret = this.phase(t, back, this.STEP_FRAMES);
    const u = go - ret;
    this.place(id, home.x + (toX - home.x) * u, home.y);
    if (t < out || t > back) this.moving[id] = true;
  },

  line(ctx, x0, y0, x1, y1) {
    const dx = x1 - x0;
    const dy = y1 - y0;
    const n = Math.max(1, Math.round(Math.max(Math.abs(dx), Math.abs(dy))));
    for (let i = 0; i <= n; i += 1) {
      ctx.fillRect(Math.round(x0 + (dx * i) / n), Math.round(y0 + (dy * i) / n), 1, 1);
    }
  },

  sheet(ctx, x, y) {
    ctx.fillStyle = this.PAL.w;
    ctx.fillRect(x, y, 5, 6);
    ctx.fillStyle = this.PAL.m;
    ctx.fillRect(x + 1, y + 1, 3, 1);
    ctx.fillRect(x + 1, y + 3, 3, 1);
  },

  // The shaft the basement report rides up in. Two rails and a ten pixel car.
  liftShaft(ctx, carY) {
    const c = this.tone();
    ctx.fillStyle = c.line;
    ctx.fillRect(135, 14, 1, 206);
    ctx.fillRect(140, 14, 1, 206);
    ctx.fillStyle = this.PAL.m;
    ctx.fillRect(136, Math.round(carY), 4, 10);
    ctx.fillStyle = c.line;
    ctx.fillRect(136, Math.round(carY), 4, 1);
  },

  // The Editor's verdict, read off the headline the article routine left.
  verdict() {
    const crew = this.state().crew || {};
    const line = String((crew.editor && crew.editor.lastHeadline) || "").toLowerCase();
    if (line.indexOf("merge with edits") >= 0) return { text: "EDIT", colour: this.PAL.o };
    if (line.indexOf("merge") >= 0) return { text: "OK", colour: this.PAL.g };
    if (line.indexOf("skip") >= 0) return { text: "SKIP", colour: this.PAL.r };
    return { text: "?", colour: this.PAL.m };
  },

  // The door's number goes up by one once the routine has dropped its draft in,
  // and stays up until the day starts again.
  prShown() {
    const pr = this.prNumber();
    if (!pr || !this.prBump) return pr;
    const n = Number(pr) + this.prBump;
    return Number.isFinite(n) ? String(n).slice(0, 4) : pr;
  },

  // The crew keeps IST office hours, so the weekday is the one in Kolkata and
  // not the one in the reader's own timezone.
  istWeekday() {
    try {
      return new Date().toLocaleDateString("en-US", { timeZone: "Asia/Kolkata", weekday: "long" });
    } catch (err) {
      return "";
    }
  },

  STEPS: [
    {
      at: "04:30",
      text: "The daily scrape starts. Ticks roll down the pipe into the racks.",
      run(t, ctx) {
        const targets = [100, 72, 44];
        for (let i = 0; i < targets.length; i += 1) {
          const u = this.phase(t, 2 + i * 6, 32 + i * 6);
          if (u <= 0) continue;
          let x = 136;
          let y = 194;
          if (u < 0.35) y = 194 + (212 - 194) * (u / 0.35);
          else { y = 212; x = 136 - (136 - targets[i]) * ((u - 0.35) / 0.65); }
          ctx.fillStyle = this.PAL.l;
          ctx.fillRect(Math.round(x), Math.round(y), 3, 3);
        }
        // The racks answer the belt: every lamp on, in turn, down the row.
        const on = Math.floor(t / 3) % this.RACKS.length;
        for (let i = 0; i < this.RACKS.length; i += 1) {
          if (i !== on) continue;
          ctx.fillStyle = this.PAL.l;
          for (let j = 0; j < 3; j += 1) ctx.fillRect(24 + i * 14 + 3, 191 + j * 6, 6, 2);
        }
      },
    },
    {
      at: "06:00",
      text: "The Physio pings the pitch: twenty pages light up green, or one turns red.",
      run(t, ctx) {
        const home = this.homeOf("physio");
        const alongOut = this.phase(t, 0, 8);
        const alongBack = this.phase(t, 42, 48);
        const upOut = this.phase(t, 8, 16);
        const upBack = this.phase(t, 36, 42);
        const x = home.x + (120 - home.x) * (alongOut - alongBack);
        const y = home.y + (36 - home.y) * (upOut - upBack);
        this.place("physio", x, y);
        if (t < 8 || t > 42) this.moving.physio = true;
        if (y < home.y - 1) {
          const c = this.tone();
          ctx.fillStyle = c.floor;
          ctx.fillRect(Math.round(x) - 1, Math.round(y) + 16, 14, 2);
          ctx.fillStyle = c.line;
          this.line(ctx, Math.round(x) + 6, 14, Math.round(x) + 6, Math.round(y) + 15);
        }
        const status = this.state().status;
        const down = !!(status && status.up === false);
        const lit = Math.round(this.phase(t, 16, 38) * 20);
        for (let i = 0; i < lit; i += 1) {
          ctx.fillStyle = down && i === 7 ? this.PAL.r : this.PAL.l;
          ctx.fillRect(144 + (i % 4) * 4, 16 + Math.floor(i / 4) * 7, 3, 3);
        }
      },
    },
    {
      at: "06:15",
      text: "The Umpire collects the report from the basement and reads it.",
      run(t, ctx) {
        const down = this.phase(t, 10, 20);
        const up = this.phase(t, 26, 36);
        const carY = 70 + (196 - 70) * (down - up);
        this.liftShaft(ctx, carY);
        if (t >= 20) this.sheet(ctx, 136, Math.round(carY) + 2);
        this.visit("umpire", 122, t, 10, 36);
        if (t >= 26) {
          const p = this.pos.umpire;
          this.sheet(ctx, p.x + 11, p.y + 6);
        }
      },
    },
    {
      at: "06:30",
      text: "The Kit Manager measures the shirts.",
      run(t, ctx) {
        this.visit("kit-manager", 100, t, 22, 34);
        const p = this.pos["kit-manager"];
        const from = this.homeOf("kit-manager").x + 6;
        ctx.fillStyle = this.PAL.y;
        ctx.fillRect(from, 122, Math.max(1, p.x + 6 - from), 1);
        ctx.fillRect(from, 120, 1, 4);
        ctx.fillRect(p.x + 6, 120, 1, 4);
        for (let x = from; x < p.x + 6; x += 4) ctx.fillRect(x, 121, 1, 1);
      },
    },
    {
      at: "06:45",
      text: "The Analyst checks the sitemaps and the schema.",
      run(t, ctx) {
        const flash = (t >= 6 && t < 12) || (t >= 18 && t < 24) || (t >= 30 && t < 36);
        if (!flash) return;
        for (let i = 0; i < 2; i += 1) {
          const mx = 24 + i * 16;
          ctx.fillStyle = this.PAL.w;
          ctx.fillRect(mx + 4, 148, 6, 8);
          ctx.fillStyle = this.PAL.k;
          ctx.fillRect(mx + 5, 150, 4, 1);
          ctx.fillRect(mx + 5, 152, 3, 1);
          ctx.fillRect(mx + 5, 154, 4, 1);
        }
      },
    },
    {
      at: "07:00",
      text: "The article routine drops a draft into the PR queue.",
      run(t, ctx) {
        if (t >= 32) return;
        const u = this.phase(t, 6, 32);
        this.sheet(ctx, Math.round(70 + (116 - 70) * u), 76);
      },
    },
    {
      at: "07:15",
      text: "The Scout scans the horizon.",
      run(t, ctx) {
        const p = this.pos.scout;
        const sweep = Math.sin((t / this.STEP_FRAMES) * Math.PI * 2);
        ctx.fillStyle = this.PAL.k;
        ctx.fillRect(p.x + 1, p.y + 3, 10, 2);
        ctx.fillStyle = this.PAL.l;
        for (let k = -1; k <= 1; k += 1) {
          this.line(ctx, p.x + 11, p.y + 4, 83, 152 + sweep * 5 + k);
        }
        ctx.fillStyle = this.PAL.w;
        ctx.fillRect(82, Math.round(152 + sweep * 5) - 1, 2, 3);
      },
    },
    {
      at: "07:30",
      text: "The Editor reads the draft and holds up a verdict card.",
      run(t, ctx) {
        // Back to the desk before the card goes up, so it does not cover the
        // door's number.
        const home = this.homeOf("editor");
        const out = this.phase(t, 0, 10);
        const back = this.phase(t, 14, 24);
        this.place("editor", home.x + (104 - home.x) * (out - back), home.y);
        if (t < 10 || (t > 14 && t < 24)) this.moving.editor = true;
        const p = this.pos.editor;
        if (t >= 12) this.sheet(ctx, p.x + 11, p.y + 6);
        if (t < 24) return;
        const v = this.verdict();
        const wide = this.textWidth(v.text) + 4;
        const cx = p.x + 6 - Math.floor(wide / 2);

        ctx.fillRect(cx - 1, p.y - 14, wide + 2, 11);
        ctx.fillStyle = v.colour;
        ctx.fillRect(cx, p.y - 13, wide, 9);
        this.drawText(ctx, v.text, cx + 2, p.y - 11, this.PAL.k);
      },
    },
    {
      at: "07:45",
      text: "The Press Officer drafts the day's posts.",
      run(t, ctx) {
        const glow = Math.floor(t / 3) % 2 === 0;
        ctx.fillStyle = glow ? this.PAL.l : this.PAL.y;
        ctx.fillRect(96, 146, 7, 1);
        ctx.fillRect(96, 146, 1, 6);
        ctx.fillRect(102, 146, 1, 6);
        const p = this.pos["press-officer"];
        for (let i = 0; i < 3; i += 1) {
          const age = t - (8 + i * 11);
          if (age < 0 || age > 14) continue;
          const bx = p.x + 13;
          const by = p.y - 1 - Math.round(age) - i * 2;
          ctx.fillStyle = this.PAL.k;
          ctx.fillRect(bx, by - 1, 11, 9);
          ctx.fillStyle = this.PAL.w;
          ctx.fillRect(bx + 1, by, 9, 7);
          ctx.fillStyle = this.PAL.m;
          ctx.fillRect(bx + 3, by + 2, 5, 1);
          ctx.fillRect(bx + 3, by + 4, 3, 1);
        }
      },
    },
    {
      at: "08:00",
      text: "The Scorer chalks the numbers on the board.",
      run(t, ctx) {
        this.visit("scorer", 126, t, 8, 40);
        const target = this.gameViews();
        let shown = "";
        for (let i = 0; i < 4; i += 1) {
          const settled = t >= 10 + i * 7;
          shown += settled ? target.charAt(i) : String((t * 3 + i * 5) % 10);
        }
        ctx.fillStyle = this.PAL.k;
        ctx.fillRect(118, 150, 20, 6);
        this.drawText(ctx, shown, 119, 151, this.PAL.l);
      },
    },
    {
      at: "10:00",
      text: "Weekdays: a laptop in the directors' box opens Search Console.",
      run(t, ctx) {
        const day = this.istWeekday();
        if (day === "Saturday" || day === "Sunday") return;
        this.place("session", 84, this.homeOf("session").y);
        const c = this.tone();
        ctx.fillStyle = c.line;
        ctx.fillRect(100, 45, 14, 2);
        const lid = Math.round(this.phase(t, 4, 14) * 9);
        if (lid < 1) return;
        ctx.fillStyle = c.line;
        ctx.fillRect(101, 45 - lid, 12, lid);
        ctx.fillStyle = c.screen;
        ctx.fillRect(102, 46 - lid, 10, Math.max(0, lid - 1));
        if (lid < 9) return;
        const bars = [3, 5, 4, 7, 6];
        const grown = this.phase(t, 16, 40);
        for (let i = 0; i < bars.length; i += 1) {
          const tall = Math.max(1, Math.round(bars[i] * grown));
          ctx.fillStyle = this.PAL.l;
          ctx.fillRect(103 + i * 2, 44 - tall, 1, tall);
        }
      },
    },
    {
      at: "10:30",
      text: "The owner reads Today, acknowledges what needs it, and says deploy. A purge sweeps the pitch once.",
      run(t, ctx) {
        this.visit("owner", 66, t, 12, 44);
        const u = this.phase(t, 20, 44);
        if (u <= 0 || u >= 1) return;
        const x = Math.round(142 + u * 18);
        ctx.fillStyle = this.PAL.l;
        ctx.fillRect(x, 12, 2, 40);
        ctx.fillStyle = "#8fbf1f";
        if (x > 143) ctx.fillRect(x - 2, 12, 2, 40);
        ctx.fillStyle = this.PAL.w;
        ctx.fillRect(x, 12, 2, 2);
      },
    },
    {
      at: "22:00",
      text: "Night. The lights dim. On Mondays the Steward patrols with the torch.",
      run(t, ctx) {
        if (this.istWeekday() !== "Monday") return;
        const span = this.STEP_FRAMES + this.HOLD_FRAMES;
        const u = this.phase(t, 4, span - 4);
        const x = Math.round(24 + u * 92);
        this.place("steward", x, 204);
        this.moving.steward = true;
        ctx.fillStyle = this.PAL.y;
        ctx.fillRect(x + 12, 210, 1, 2);
        for (let k = 0; k < 9; k += 1) {
          ctx.fillStyle = k % 2 === 0 ? "#7a6a1e" : "#5d5117";
          this.line(ctx, x + 13, 211, Math.min(138, x + 13 + k * 2), 205 + k);
        }
      },
    },
  ],
};

// Every figure stands on its room's floor, twenty four pixels below the ceiling.
for (const room of Clubhouse.ROOMS) {
  for (const id of room.members) {
    Clubhouse.FIGURES.push({ id: id, room: room.id, home: { x: Clubhouse.HOME_X[id], y: room.y + 24 } });
  }
}

Clubhouse.nightPref = Clubhouse.night;
Clubhouse.resetPositions();

// Called again on every database snapshot, so it binds once, keeps the frame
// the day is on, and only refreshes what the new numbers changed.
OpsRoom.renderClubhouse = function (root) {
  Clubhouse.mount(root);
  Clubhouse.redraw();
  if (Clubhouse.selected) Clubhouse.renderClubhouseCard(Clubhouse.selected);
  Clubhouse.autoPlay();
};

window.Clubhouse = Clubhouse;
</script>

<script>
window.addEventListener("DOMContentLoaded", () => OpsRoom.init());
</script>
