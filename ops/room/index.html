<title>Ops Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap">
<style>
:root {
  --bg: #f3f4f8; --surface: #ffffff; --surface-muted: #eceef4; --border: #dde1ea; --border-strong: #c3cad8;
  --text: #0b1324; --text-muted: #5a6478; --text-faint: #8b95a8;
  --sig: #c6f135; --sig-ink: #4d7c0f; --sig-soft: #eef9c9; --sig-on: #0b1324;
  --mast: #0b1324; --mast-2: #121c33; --mast-text: #eef1f7; --mast-muted: #9aa5bd; --mast-line: rgba(255,255,255,.08);
  --ok: #15803d; --warn: #d97706; --fail: #b91c1c; --live: #ff3b5c;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Barlow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b1324; --surface: #121c33; --surface-muted: #182342; --border: #24304f; --border-strong: #34426a; --text: #eef1f7; --text-muted: #9aa5bd; --text-faint: #6f7b96; --sig-ink: #c6f135; --sig-soft: #1d2a12; } }
:root[data-theme="dark"] { --bg: #0b1324; --surface: #121c33; --surface-muted: #182342; --border: #24304f; --border-strong: #34426a; --text: #eef1f7; --text-muted: #9aa5bd; --text-faint: #6f7b96; --sig-ink: #c6f135; --sig-soft: #1d2a12; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--body); margin: 0; padding-block: 0 32px; padding-inline: 16px; }

/* Tokens added on top of the site set: readable ink for the state colours in both themes. */
:root { --ok-ink: #15803d; --warn-ink: #a35709; --fail-ink: #b91c1c; --radius: 10px; --card-shadow: 0 1px 2px rgba(11,19,36,.06); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok-ink: #5fd88a; --warn-ink: #f2b43c; --fail-ink: #ff8d8d; --card-shadow: 0 1px 2px rgba(0,0,0,.45); } }
:root[data-theme="dark"] { --ok-ink: #5fd88a; --warn-ink: #f2b43c; --fail-ink: #ff8d8d; --card-shadow: 0 1px 2px rgba(0,0,0,.45); }

*, *::before, *::after { box-sizing: border-box; }
:focus-visible { outline: 2px solid var(--sig-ink); outline-offset: 2px; }
.mast :focus-visible { outline-color: var(--sig); }

.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; margin-inline: -16px; padding-inline: 16px;
  background: var(--mast); background-image: linear-gradient(180deg, var(--mast-2), var(--mast));
  color: var(--mast-text); border-bottom: 2px solid var(--sig); }
.mast-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; padding: 10px 0 6px; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 27px; line-height: 1; letter-spacing: .05em; text-transform: uppercase; }
.wordmark::after { content: ""; display: inline-block; width: 9px; height: 9px; background: var(--sig); margin-left: 8px; vertical-align: 2px; }
.site { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--mast-muted); }
.mast-status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.mast .dot-ok { background: var(--sig); }
.mast .dot-fail { background: var(--live); }
.mast .dot-none { background: var(--mast-muted); }

.tabs-scroll { max-width: 1080px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
.tabs-scroll::-webkit-scrollbar { display: none; }
.tabs { display: flex; gap: 2px; min-width: max-content; }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--mast-muted);
  font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  padding: 9px 12px 7px; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--mast-text); }
.tab[aria-selected="true"] { color: var(--mast-text); border-bottom-color: var(--sig); }
@media (prefers-reduced-motion: no-preference) { .tab { transition: color .15s ease, border-color .15s ease; } .chev { transition: background .15s ease, border-color .15s ease; } }

main { max-width: 1080px; margin: 0 auto; }
[role="tabpanel"] { padding-top: 16px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--card-shadow); padding: 13px 14px; margin: 0 0 14px; }
.card-rows { padding-bottom: 0; }
.card.alert { border-color: var(--fail); border-left: 4px solid var(--fail); }
.sect { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 14px;
  letter-spacing: .09em; text-transform: uppercase; color: var(--text-muted); margin: 0; }
.sect::before { content: ""; width: 9px; height: 15px; background: var(--sig); flex: none; }
.sect .sect-note { margin-left: auto; font-weight: 600; font-size: 13px; letter-spacing: .06em; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.empty { color: var(--text-muted); margin: 8px 0 0; }

.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-faint); display: inline-block; flex: none; }
.dot-ok { background: var(--ok-ink); }
.dot-warn { background: var(--warn-ink); }
.dot-fail { background: var(--fail-ink); }
.dot-none { background: var(--border-strong); }
.dot-lg { width: 13px; height: 13px; }

.banner { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; margin-top: 8px; }
.banner-state { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.is-ok { color: var(--ok-ink); }
.is-fail { color: var(--fail-ink); }
.banner-meta { color: var(--text-muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--surface-muted);
  border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; color: var(--text-muted); }
.banner-time { margin-left: auto; color: var(--text-faint); font-size: 12px; }
.pill { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .07em; text-transform: uppercase;
  padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; }
.pill-warn { color: var(--warn-ink); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(74px, 1fr)); gap: 8px; margin-top: 10px; }
.tile { background: var(--surface-muted); border-radius: 0 8px 8px 0; border-left: 4px solid var(--border-strong); padding: 8px 10px; }
.tile-n { display: block; font-family: var(--display); font-weight: 800; font-size: 27px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile-l { display: block; margin-top: 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
.tile-critical { border-left-color: var(--fail); } .tile-critical .tile-n { color: var(--fail-ink); }
.tile-high { border-left-color: var(--warn); } .tile-high .tile-n { color: var(--warn-ink); }
.tile-medium { border-left-color: var(--sig); }
.tile-low { border-left-color: var(--border-strong); } .tile-low .tile-n { color: var(--text-muted); }
.tile.is-zero .tile-n { color: var(--text-faint); }

.crew-row { display: grid; align-items: center; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--border);
  grid-template-columns: 10px minmax(0, 1fr) auto 28px; grid-template-areas: "dot who when chev" "pad line line line"; }
.crew-row .dot { grid-area: dot; }
.crew-who { grid-area: who; min-width: 0; }
.crew-line { grid-area: line; min-width: 0; color: var(--text-muted); font-size: 14px; overflow-wrap: anywhere; }
.crew-when { grid-area: when; color: var(--text-faint); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { grid-area: chev; appearance: none; background: none; border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-muted); width: 28px; height: 28px; line-height: 1; font-size: 17px; cursor: pointer; }
.chev:hover { background: var(--surface-muted); border-color: var(--border-strong); color: var(--text); }
.crew-name { font-weight: 600; }
.crew-role { color: var(--text-muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; font-family: var(--display); }
@media (min-width: 720px) {
  .crew-row { grid-template-columns: 10px minmax(150px, 20%) minmax(0, 1fr) auto 28px; grid-template-areas: "dot who line when chev"; }
}

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 14px; margin-top: 10px; }
.stat-l { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
.stat-v { font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat-sub { font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.rule { border: 0; border-top: 1px solid var(--border); margin: 12px 0 0; }
.md :is(h1, h2, h3) { font-family: var(--display); letter-spacing: .02em; }
.md pre { overflow-x: auto; background: var(--surface-muted); padding: 10px; border-radius: 8px; }
</style>

<div class="mast" role="banner">
  <div class="mast-in">
    <span class="wordmark">Ops Room</span>
    <span class="site">sports-db.live</span>
    <span class="mast-status"><span class="dot dot-none" id="mast-dot"></span><span id="mast-text">Checking</span></span>
  </div>
  <div class="tabs-scroll">
    <nav class="tabs" role="tablist" aria-label="Ops Room sections">
      <button type="button" class="tab" role="tab" id="tab-today" aria-controls="panel-today" aria-selected="true">Today</button>
      <button type="button" class="tab" role="tab" id="tab-issues" aria-controls="panel-issues" aria-selected="false" tabindex="-1">Issues</button>
      <button type="button" class="tab" role="tab" id="tab-runs" aria-controls="panel-runs" aria-selected="false" tabindex="-1">Runs</button>
      <button type="button" class="tab" role="tab" id="tab-crew" aria-controls="panel-crew" aria-selected="false" tabindex="-1">Crew</button>
      <button type="button" class="tab" role="tab" id="tab-rules" aria-controls="panel-rules" aria-selected="false" tabindex="-1">Rulebook</button>
      <button type="button" class="tab" role="tab" id="tab-clubhouse" aria-controls="panel-clubhouse" aria-selected="false" tabindex="-1">Clubhouse</button>
    </nav>
  </div>
</div>

<main>
  <section role="tabpanel" id="panel-today" aria-labelledby="tab-today" tabindex="0"></section>
  <section role="tabpanel" id="panel-issues" aria-labelledby="tab-issues" tabindex="0" hidden><p class="empty">Issues</p></section>
  <section role="tabpanel" id="panel-runs" aria-labelledby="tab-runs" tabindex="0" hidden><p class="empty">Runs</p></section>
  <section role="tabpanel" id="panel-crew" aria-labelledby="tab-crew" tabindex="0" hidden><p class="empty">Crew</p></section>
  <section role="tabpanel" id="panel-rules" aria-labelledby="tab-rules" tabindex="0" hidden><p class="empty">Rulebook</p></section>
  <section role="tabpanel" id="panel-clubhouse" aria-labelledby="tab-clubhouse" tabindex="0" hidden><p class="empty">Clubhouse under construction</p></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
if (!window.claude) window.claude = { use: async () => null };

const OpsRoom = {
  state: { crew: {}, issues: {}, runs: {}, status: null, daily: {}, rules: {}, dbReady: null },
  db: null,
  active: "today",
  filterAgent: null,
  tabs: [],

  async init() {
    this.bindTabs();
    this.render();
    let db = null;
    try { db = await claude.use("db"); } catch (err) { db = null; }
    this.db = db;
    this.state.dbReady = db !== null;
    if (db) this.subscribe();
    this.render();
  },

  subscribe() {
    const db = this.db;
    const into = (name) => (snap) => {
      const next = {};
      for (const d of snap.docs) next[d.id] = { id: d.id, ...d.data() };
      this.state[name] = next;
      this.render();
    };
    db.collection("crew").onSnapshot(into("crew"), (e) => this.fail("crew", e));
    db.collection("issues").where("status", "in", ["open", "acknowledged", "reopened", "fixed"]).limit(1000).onSnapshot(into("issues"), (e) => this.fail("issues", e));
    db.collection("runs").orderBy("date", "desc").limit(300).onSnapshot(into("runs"), (e) => this.fail("runs", e));
    db.collection("daily").orderBy("date", "desc").limit(30).onSnapshot(into("daily"), (e) => this.fail("daily", e));
    db.collection("rules").onSnapshot(into("rules"), (e) => this.fail("rules", e));
    db.doc("status/site").onSnapshot((snap) => { this.state.status = snap.exists ? snap.data() : null; this.render(); }, (e) => this.fail("status", e));
  },

  fail(name, e) { console.warn("subscription " + name + " ended: " + (e && e.code)); },

  bindTabs() {
    const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
    this.tabs = tabs;
    let saved = null;
    try { saved = localStorage.getItem("opsroom.tab"); } catch (err) { saved = null; }
    if (saved && tabs.some((t) => t.id === "tab-" + saved)) this.active = saved;
    tabs.forEach((tab, i) => {
      tab.addEventListener("click", () => this.setActive(this.nameOf(tab)));
      tab.addEventListener("keydown", (ev) => {
        let n = -1;
        if (ev.key === "ArrowRight") n = (i + 1) % tabs.length;
        else if (ev.key === "ArrowLeft") n = (i - 1 + tabs.length) % tabs.length;
        else if (ev.key === "Home") n = 0;
        else if (ev.key === "End") n = tabs.length - 1;
        if (n < 0) return;
        ev.preventDefault();
        tabs[n].focus();
        this.setActive(this.nameOf(tabs[n]));
      });
    });
    this.setActive(this.active, true);
  },

  nameOf(tab) { return tab.id.slice(4); },

  setActive(name, quiet) {
    this.active = name;
    try { localStorage.setItem("opsroom.tab", name); } catch (err) { /* storage can be blocked */ }
    for (const tab of this.tabs) {
      const on = this.nameOf(tab) === name;
      tab.setAttribute("aria-selected", on ? "true" : "false");
      tab.tabIndex = on ? 0 : -1;
      const panel = document.getElementById("panel-" + this.nameOf(tab));
      if (panel) panel.hidden = !on;
    }
    if (!quiet) this.render();
  },

  render() {
    this.renderMasthead();
    const root = document.getElementById("panel-" + this.active);
    if (!root) return;
    const fn = {
      today: "renderToday", issues: "renderIssues", runs: "renderRuns",
      crew: "renderCrew", rules: "renderRules", clubhouse: "renderClubhouse",
    }[this.active];
    if (fn && typeof this[fn] === "function") this[fn](root);
  },

  renderMasthead() {
    const dot = document.getElementById("mast-dot");
    const text = document.getElementById("mast-text");
    if (!dot || !text) return;
    const s = this.state.status;
    let tone = "none";
    let label = "No check yet";
    if (s) {
      tone = s.up ? "ok" : "fail";
      label = s.up ? "Up" : "Down";
      if (this.has(s.latencyMs)) label += " " + this.num(Math.round(Number(s.latencyMs))) + " ms";
    } else if (this.state.dbReady === false) {
      label = "No database";
    }
    dot.className = "dot dot-" + tone;
    text.textContent = label;
  },

  renderToday(root) {
    const kids = [this.todayStatus(), this.todayCounts(), this.todayCrew(), this.todayNumbers()];
    if (this.state.dbReady === false) {
      kids.push(this.h("section", { class: "card alert" },
        this.h("p", { class: "empty", text: "This view cannot reach the Ops Room database. Open the page signed in as the owner." })));
    }
    root.replaceChildren(...kids);
  },

  todayStatus() {
    const h = this.h;
    const s = this.state.status;
    const card = h("section", { class: "card" }, h("h2", { class: "sect" }, "Site"));
    if (!s) {
      card.append(h("p", { class: "empty", text: "No check yet" }));
      return card;
    }
    const up = !!s.up;
    card.append(h("div", { class: "banner" },
      h("span", { class: "dot dot-lg dot-" + (up ? "ok" : "fail") }),
      h("span", { class: "banner-state " + (up ? "is-ok" : "is-fail"), text: up ? "Up" : "Down" }),
      this.has(s.latencyMs) ? h("span", { class: "banner-meta", text: this.num(Math.round(Number(s.latencyMs))) + " ms" }) : null,
      this.has(s.productionCommit) ? h("span", { class: "code", title: "production commit", text: String(s.productionCommit).slice(0, 7) }) : null,
      s.deployPending ? h("span", { class: "pill pill-warn", text: "deploy pending" }) : null,
      s.edgeStale ? h("span", { class: "pill pill-warn", text: "edge stale" }) : null,
      this.ago(s.checkedAt) ? h("span", { class: "banner-time", text: "checked " + this.ago(s.checkedAt) }) : null,
    ));
    return card;
  },

  todayCounts() {
    const h = this.h;
    const order = ["critical", "high", "medium", "low"];
    const counts = { critical: 0, high: 0, medium: 0, low: 0 };
    let total = 0;
    for (const key of Object.keys(this.state.issues)) {
      const it = this.state.issues[key];
      if (it.status !== "open" && it.status !== "reopened") continue;
      total += 1;
      const sev = String(it.severity || "low").toLowerCase();
      counts[order.indexOf(sev) < 0 ? "low" : sev] += 1;
    }
    const card = h("section", { class: "card" },
      h("h2", { class: "sect" }, "Open issues", h("span", { class: "sect-note", text: this.num(total) + " open" })));
    const tiles = h("div", { class: "tiles" });
    for (const sev of order) {
      tiles.append(h("div", { class: "tile tile-" + sev + (counts[sev] === 0 ? " is-zero" : "") },
        h("span", { class: "tile-n", text: this.num(counts[sev]) }),
        h("span", { class: "tile-l", text: sev })));
    }
    card.append(tiles);
    return card;
  },

  todayCrew() {
    const h = this.h;
    const list = Object.keys(this.state.crew).map((k) => this.state.crew[k]);
    list.sort((a, b) => {
      const d = this.cronMinutes(a.schedule) - this.cronMinutes(b.schedule);
      return d !== 0 ? d : String(a.name || a.id).localeCompare(String(b.name || b.id));
    });
    const card = h("section", { class: "card card-rows" },
      h("h2", { class: "sect" }, "Crew", h("span", { class: "sect-note", text: this.num(list.length) + " agents" })));
    if (!list.length) {
      card.append(h("p", { class: "empty", text: this.state.dbReady === false ? "No crew list" : "Waiting for the crew list" }));
      return card;
    }
    for (const c of list) {
      const status = String(c.lastStatus || "none");
      const tone = status === "ok" || status === "warn" || status === "fail" ? status : "none";
      card.append(h("div", { class: "crew-row" },
        h("span", { class: "dot dot-" + tone, title: tone === "none" ? "no run yet" : tone }),
        h("div", { class: "crew-who" },
          h("span", { class: "crew-name", text: c.name || c.id }), " ",
          h("span", { class: "crew-role", text: c.role || "" })),
        h("div", { class: "crew-line", text: c.lastHeadline || "No run yet" }),
        h("time", { class: "crew-when", datetime: this.has(c.lastRunAt) ? String(c.lastRunAt) : null, text: this.dayLabel(c.lastRunAt) }),
        h("button", {
          type: "button", class: "chev", "aria-label": "Runs for " + (c.name || c.id),
          onclick: () => { this.filterAgent = c.id; this.setActive("runs"); },
        }, "›")));
    }
    return card;
  },

  todayNumbers() {
    const h = this.h;
    const d = this.latestDaily();
    const card = h("section", { class: "card" },
      h("h2", { class: "sect" }, "Yesterday's numbers",
        d ? h("span", { class: "sect-note", text: this.dayLabel(d.date || d.id) }) : null));
    if (!d) {
      card.append(h("p", { class: "empty", text: "No numbers yet" }));
      return card;
    }
    const top = Array.isArray(d.topGames) && d.topGames.length ? d.topGames[0] : null;
    const country = this.topShare(d.byCountry);
    const mobile = this.mobileShare(d.byPlatform);
    card.append(h("div", { class: "stats" },
      this.stat("game views", this.has(d.gameViews) ? this.num(d.gameViews) : "not reported"),
      this.stat("top game", top ? (top.name || top.id || "unknown") : "not reported", top && this.has(top.views) ? this.num(top.views) + " views" : null),
      this.stat("top country", country ? country.key + " " + this.pct(country.share) : "not reported", country ? this.num(country.value) + " views" : null),
      this.stat("mobile", mobile === null ? "not reported" : this.pct(mobile))));
    card.append(h("hr", { class: "rule" }));
    const gsc = ["gscClicks", "gscImpressions", "gscIndexed", "gscNotIndexed"];
    if (!gsc.some((k) => this.has(d[k]))) {
      card.append(h("p", { class: "empty", text: "no Search Console reading yet" }));
      return card;
    }
    const labels = { gscClicks: "clicks", gscImpressions: "impressions", gscIndexed: "indexed", gscNotIndexed: "not indexed" };
    const row = h("div", { class: "stats" });
    for (const k of gsc) row.append(this.stat(labels[k], this.has(d[k]) ? this.num(d[k]) : "not reported"));
    card.append(row);
    return card;
  },

  stat(label, value, sub) {
    const h = this.h;
    return h("div", { class: "stat" },
      h("div", { class: "stat-l", text: label }),
      h("div", { class: "stat-v", text: value }),
      sub ? h("div", { class: "stat-sub", text: sub }) : null);
  },

  latestDaily() {
    let best = null;
    for (const key of Object.keys(this.state.daily)) {
      const d = this.state.daily[key];
      const k = String(d.date || d.id || key);
      if (!best || k > String(best.date || best.id)) best = d;
    }
    return best;
  },

  topShare(map) {
    if (!map || typeof map !== "object") return null;
    let total = 0;
    let key = null;
    let value = 0;
    for (const k of Object.keys(map)) {
      const n = Number(map[k]);
      if (!Number.isFinite(n)) continue;
      total += n;
      if (n > value) { value = n; key = k; }
    }
    if (!key || total <= 0) return null;
    return { key: key, value: value, share: value / total };
  },

  mobileShare(map) {
    if (!map || typeof map !== "object") return null;
    let total = 0;
    for (const k of Object.keys(map)) {
      const n = Number(map[k]);
      if (Number.isFinite(n)) total += n;
    }
    if (total <= 0) return null;
    const ios = Number(map.ios) || 0;
    const android = Number(map.android) || 0;
    return (ios + android) / total;
  },

  h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    const a = attrs || {};
    for (const k of Object.keys(a)) {
      const v = a[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = String(v);
      else if (k === "text") el.textContent = String(v);
      else if (k === "html") el.innerHTML = String(v);
      else if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
    for (const kid of kids) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid && kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  },

  esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  },

  has(v) { return v !== null && v !== undefined && v !== "" && !(typeof v === "number" && !Number.isFinite(v)); },

  num(n) {
    const v = Number(n);
    if (!Number.isFinite(v)) return "0";
    return v.toLocaleString("en-US");
  },

  pct(x) {
    const v = Number(x);
    if (!Number.isFinite(v)) return "0%";
    return Math.round(v * 100) + "%";
  },

  ago(iso) {
    const t = Date.parse(iso);
    if (!Number.isFinite(t)) return "";
    const secs = Math.floor((Date.now() - t) / 1000);
    if (secs < 60) return "just now";
    const mins = Math.floor(secs / 60);
    if (mins < 60) return mins + " min ago";
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + " h ago";
    const days = Math.floor(hours / 24);
    return days === 1 ? "1 day ago" : days + " days ago";
  },

  dayLabel(iso) {
    const t = Date.parse(iso);
    if (!Number.isFinite(t)) return "";
    const d = new Date(t);
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return d.getDate() + " " + months[d.getMonth()];
  },

  cronMinutes(cron) {
    const parts = String(cron || "").trim().split(/\s+/);
    if (parts.length < 2) return 24 * 60;
    const field = (f) => {
      const n = parseInt(String(f).replace(/^\*\//, ""), 10);
      return Number.isFinite(n) ? n : 0;
    };
    return field(parts[1]) * 60 + field(parts[0]);
  },

  renderMarkdown(md) {
    let out = "";
    try {
      out = window.marked && typeof window.marked.parse === "function" ? window.marked.parse(String(md || "")) : this.esc(md);
    } catch (err) {
      out = this.esc(md);
    }
    return String(out)
      .replace(/<script[\s\S]*?<\/script\s*>/gi, "")
      .replace(/<script[^>]*>/gi, "")
      .replace(/\son[a-z-]+\s*=\s*"[^"]*"/gi, "")
      .replace(/\son[a-z-]+\s*=\s*'[^']*'/gi, "")
      .replace(/\son[a-z-]+\s*=\s*[^\s>]+/gi, "")
      .replace(/href\s*=\s*"\s*javascript:[^"]*"/gi, 'href="#"')
      .replace(/href\s*=\s*'\s*javascript:[^']*'/gi, 'href="#"');
  },
};

window.OpsRoom = OpsRoom;
window.addEventListener("DOMContentLoaded", () => OpsRoom.init());
</script>
